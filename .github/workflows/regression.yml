name: Full firmware regression checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install site dependency
        run: python3 -m pip install -r site/requirements.txt
      - name: Run complete firmware and tool regression suite
        run: |
          python3 scripts/build_pin_overview.py
          python3 scripts/verify_pin_overview.py
          python3 scripts/pin_families.py --check
          python3 scripts/test_pin_families.py
          python3 scripts/test_pin_configuration.py --check
          python3 scripts/map_names.py
          python3 scripts/verify_map_names.py
          python3 scripts/build_verification_ledger.py --check
          python3 scripts/firmware_catalog.py --check
          python3 scripts/dataset_inventory.py --check
          python3 scripts/decode_firmware_maps.py --check
          python3 scripts/audit_firmware_families.py --check
          python3 scripts/test_firmware_lookups.py
          python3 scripts/test_speed_sources.py --check
          python3 scripts/test_ignition_profiles.py --check
          python3 scripts/test_late_auxiliary_controls.py --check
          python3 scripts/test_late_mode_triggers.py --check
          python3 scripts/test_pressure_sources.py --check
          python3 scripts/test_fuel_transfer.py --check
          python3 scripts/test_alternate_paths.py --check
          python3 scripts/test_fuel_modes.py --check
          python3 scripts/test_input_coordinates.py --check
          python3 scripts/test_map_entry_paths.py --check
          python3 scripts/test_operating_sequences.py --check
          python3 scripts/test_pressure_interleaving.py --check
          python3 scripts/test_late_transient_maps.py --check
          python3 scripts/verify_vehicle_catalog.py
          python3 scripts/test_firmware_library.py
          python3 scripts/build_pages.py
          python3 scripts/verify_pages.py
          python3 scripts/verify_decoded_pages.py
          python3 scripts/verify_site_routes.py
          python3 scripts/test_static_site.py
          node scripts/test_tools.mjs
          node scripts/test_flashing.mjs
          node scripts/test_map_workspace.mjs
          python3 scripts/test_xdf_export.py
          node scripts/test_tunerpro_capture.mjs
          python3 scripts/test_feature_patches.py
          python3 scripts/test_speed_patch.py
          node scripts/test_speed_tools.mjs
          node scripts/test_co_tools.mjs
          python3 scripts/test_co_override.py
          python3 scripts/test_o2_control.py
          python3 scripts/test_interlock_features.py
